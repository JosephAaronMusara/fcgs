# Option A: prepare an UNSIGNED package only. GitHub Actions has NO permission to
# call AWS KMS Sign, assume an AWS role, or publish a release to the Portal.
# An MFA-protected FCGS release operator independently signs approved packages.
name: FCGS Gate Bridge — prepare unsigned release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Bridge version, e.g. fcgs-gate-bridge/1.1.1'
        required: true
        type: string
      release_id:
        description: 'Immutable release ID, e.g. bridge_1_1_1_pilot_1'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: gate-bridge-package-${{ inputs.release_id }}
  cancel-in-progress: false
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: gate-bridge-production
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Source validation
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run access-control:source-check
          npm run access-control:reliability-check
          npm run access-control:build2-source-check
          npm run fee-schedule:source-check
          npm run access-control:consolidated-test
          node script/test-academic-calendar-newsletters.cjs
          node script/test-sage-bulk-approval.cjs
          python3 script/test-gate-bridge-manual-signing.py
      - name: Compile versioned Windows runtime
        env:
          FCGS_SIGNED_BRIDGE_BUILD_VERSION: ${{ inputs.version }}
        run: npm run build
      - name: Fetch pinned Windows runtime and license files
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fcgs-unsigned-package/assets"
          cp gate-bridge-windows/assets/{gate-bridge.cjs,Start-GateBridge.ps1,Update-GateBridge.ps1,THIRD_PARTY_NOTICES.md} "$RUNNER_TEMP/fcgs-unsigned-package/assets/"
          download_pinned() {
            local url="$1" expected="$2" dest="$3"
            [[ "$url" == https://* ]] || { echo 'HTTPS vendor source required'; exit 1; }
            [[ "$expected" =~ ^[A-Fa-f0-9]{64}$ ]] || { echo 'SHA-256 pin required'; exit 1; }
            curl --fail --location --silent --show-error --retry 3 --proto '=https' --tlsv1.2 "$url" --output "$dest"
            echo "$expected  $dest" | sha256sum --check --status || { echo "Vendor asset hash check failed: $dest"; exit 1; }
          }
          # Match the verified versions already pinned by
          # script/prepare-gate-bridge-windows-runtime.ts. No GitHub secrets,
          # AWS credentials or user-editable vendor URLs are needed.
          download_pinned 'https://nodejs.org/dist/v22.16.0/win-x64/node.exe' \
            'c5ff4c736112dd483c750fd4149d30c8a116db1a49b8b3ec88be4b65e6c86c19' \
            "$RUNNER_TEMP/fcgs-unsigned-package/assets/node.exe"
          download_pinned 'https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe' \
            '05b82d46ad331cc16bdc00de5c6332c1ef818df8ceefcd49c726553209b3a0da' \
            "$RUNNER_TEMP/fcgs-unsigned-package/assets/FCGSGateBridgeService.exe"
          download_pinned 'https://raw.githubusercontent.com/nodejs/node/v22.16.0/LICENSE' \
            '1ae62e2015784ba438db7b04ebd33f3c4ff3efdb824c111c4ececd99945fd52d' \
            "$RUNNER_TEMP/fcgs-unsigned-package/assets/LICENSE-Node.txt"
          download_pinned 'https://raw.githubusercontent.com/winsw/winsw/v2.12.0/LICENSE.txt' \
            '1cdf703c10a70e5973bf3acf2a5eeabe7746237155b92db2034aeae26fdf7802' \
            "$RUNNER_TEMP/fcgs-unsigned-package/assets/LICENSE-WinSW.txt"
      - name: Generate source-bound immutable unsigned manifest
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_ID: ${{ inputs.release_id }}
          FCGS_RELEASE_SOURCE_COMMIT: ${{ github.sha }}
          FCGS_RELEASE_GITHUB_RUN_ID: ${{ github.run_id }}
          FCGS_RELEASE_GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/fcgs-unsigned-package"
          node script/gate-bridge-create-release-manifest.mjs "$VERSION" "$RELEASE_ID" "$package/assets" "$package"
          echo '========================================'
          echo 'UNSIGNED RELEASE: REQUIRES SEPARATE APPROVAL'
          echo "SOURCE_COMMIT=$FCGS_RELEASE_SOURCE_COMMIT"
          echo "RELEASE_ID=$RELEASE_ID"
          echo "RELEASE_VERSION=$VERSION"
          echo "MANIFEST_SHA256=$(sha256sum "$package/manifest.json" | cut -d' ' -f1)"
          echo 'Compare these against the downloaded manifest before signing.'
          echo '========================================'
      - name: Upload unsigned artifact (NEVER INSTALLABLE)
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-fcgs-${{ inputs.release_id }}
          path: ${{ runner.temp }}/fcgs-unsigned-package/
          if-no-files-found: error
          retention-days: 30
# This workflow does not sign, approve, publish or activate Gate Bridge updates.
