# FCGS Portal multi-worker upstream. This file belongs in /etc/nginx/conf.d/.
upstream fcgs_backend {
    least_conn;
    keepalive 64;
    server 127.0.0.1:5001 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:5002 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:5003 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:5004 max_fails=2 fail_timeout=10s;
}

# Safe failover for connection errors and failed/read-only upstreams. Nginx does
# not replay non-idempotent requests after they have been sent unless
# `non_idempotent` is explicitly enabled; we intentionally do not enable it.
proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
proxy_next_upstream_tries 4;
proxy_connect_timeout 3s;
